<style>
/* Layout: mobile-first app shell (max 480px column), bottom tab bar; warm = opwarmen, cool = afkoelen */
:root {
  --bg: #EEF2F1;
  --surface: #FFFFFF;
  --ink: #182326;
  --muted: #56666A;
  --line: #D6DFDD;
  --warm: #C9531F;
  --warm-soft: #FBE4D6;
  --cool: #23707F;
  --cool-soft: #D7ECEF;
  --good: #2F7D4F;
  --bad: #A8402E;
  --shadow: 0 1px 2px rgb(24 35 38 / .06), 0 6px 20px rgb(24 35 38 / .06);
  --f-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
  --r: 18px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101618; --surface: #1A2326; --ink: #E7EEEE; --muted: #9AABAE; --line: #2B373A;
    --warm: #F08657; --warm-soft: #3B2418; --cool: #63BCCB; --cool-soft: #15313A;
    --good: #6CC593; --bad: #F08A78; --shadow: 0 1px 2px rgb(0 0 0 / .3);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #101618; --surface: #1A2326; --ink: #E7EEEE; --muted: #9AABAE; --line: #2B373A;
  --warm: #F08657; --warm-soft: #3B2418; --cool: #63BCCB; --cool-soft: #15313A;
  --good: #6CC593; --bad: #F08A78; --shadow: 0 1px 2px rgb(0 0 0 / .3);
  color-scheme: dark;
}
html, body { background: var(--bg); color: var(--ink); }
body { font-family: var(--f-body); font-size: 16px; line-height: 1.5; -webkit-tap-highlight-color: transparent; }
* { box-sizing: border-box; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, a:focus-visible { outline: 3px solid var(--cool); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--f-display); line-height: 1.1; text-wrap: balance; margin: 0; letter-spacing: -0.01em; }
h1 { font-size: 2rem; font-weight: 800; }
h2 { font-size: 1.35rem; font-weight: 700; }
h3 { font-size: 1.05rem; font-weight: 700; }
p { margin: 0; }
.muted { color: var(--muted); }
.eyebrow { font-size: .75rem; text-transform: uppercase; letter-spacing: .09em; font-weight: 700; color: var(--muted); }

.shell {
  max-width: 480px; margin: 0 auto; min-height: 100%;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 120px;
  display: flex; flex-direction: column; gap: 22px;
}
.shell.no-nav { padding-bottom: 40px; }
.proto { align-self: flex-start; font-size: .72rem; letter-spacing: .06em; text-transform: uppercase; font-weight: 700; color: var(--muted); border: 1px dashed var(--line); border-radius: 99px; padding: 3px 10px; }

/* Buttons */
.btn { border: 0; border-radius: 14px; padding: 15px 20px; font-weight: 700; font-size: 1.02rem; background: var(--ink); color: var(--bg); width: 100%; }
.btn.warm { background: var(--warm); color: #fff; }
.btn.cool { background: var(--cool); color: #fff; }
:root[data-theme="dark"] .btn.warm, :root[data-theme="dark"] .btn.cool { color: #101618; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .btn.warm, :root:not([data-theme="light"]) .btn.cool { color: #101618; } }
.btn.ghost { background: transparent; color: var(--ink); border: 1.5px solid var(--line); }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.link { background: none; border: 0; padding: 6px 0; color: var(--muted); text-decoration: underline; text-underline-offset: 3px; }
.iconbtn { width: 44px; height: 44px; border-radius: 50%; border: 1.5px solid var(--line); background: var(--surface); display: grid; place-items: center; flex: none; }
.iconbtn svg { width: 20px; height: 20px; }
.topbar { display: flex; align-items: center; gap: 12px; }
.topbar .t { flex: 1; min-width: 0; }

/* Onboarding */
.ob { display: flex; flex-direction: column; gap: 24px; min-height: calc(100dvh - 80px); }
.ob-body { flex: 1; display: flex; flex-direction: column; gap: 18px; }
.dots { display: flex; gap: 6px; }
.dots i { height: 5px; flex: 1; border-radius: 9px; background: var(--line); }
.dots i.on { background: var(--ink); }
.choice-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.choice { text-align: left; border: 1.5px solid var(--line); background: var(--surface); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.choice b { font-family: var(--f-display); font-size: 1.02rem; }
.choice span { font-size: .84rem; color: var(--muted); }
.choice[aria-pressed="true"] { border-color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--ink); }
.choice-list { display: flex; flex-direction: column; gap: 10px; }
.field { width: 100%; font: inherit; font-size: 1.1rem; padding: 14px 16px; border-radius: 14px; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); }
.hero-wave { height: 140px; border-radius: var(--r); background: linear-gradient(120deg, var(--warm-soft), var(--cool-soft)); display: flex; align-items: center; justify-content: center; gap: 5px; overflow: hidden; }
.hero-wave i { width: 6px; border-radius: 6px; background: var(--ink); opacity: .85; animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 50% { transform: scaleY(.45); } }
@media (prefers-reduced-motion: reduce) { .hero-wave i { animation: none; } }

/* Home */
.greet { display: flex; flex-direction: column; gap: 4px; }
.mode-card { border: 0; text-align: left; border-radius: var(--r); padding: 20px; display: flex; flex-direction: column; gap: 14px; width: 100%; }
.mode-card.warm { background: var(--warm-soft); }
.mode-card.cool { background: var(--cool-soft); }
.mode-card .row { display: flex; align-items: center; gap: 12px; }
.mode-card .badge { width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; flex: none; }
.mode-card.warm .badge { background: var(--warm); color: var(--warm-soft); }
.mode-card.cool .badge { background: var(--cool); color: var(--cool-soft); }
.mode-card .badge svg { width: 24px; height: 24px; }
.mode-card h2 { font-size: 1.5rem; }
.mode-card .meta { display: flex; gap: 14px; font-size: .9rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.mode-card .go { margin-left: auto; font-weight: 700; display: flex; align-items: center; gap: 4px; }
.mode-card.warm .go { color: var(--warm); }
.mode-card.cool .go { color: var(--cool); }
.soon { border: 1.5px dashed var(--line); border-radius: var(--r); padding: 16px 18px; display: flex; flex-direction: column; gap: 6px; }
.tag { display: inline-flex; align-items: center; gap: 4px; font-size: .74rem; font-weight: 700; padding: 3px 9px; border-radius: 99px; background: var(--line); color: var(--ink); white-space: nowrap; }
.tag.fav { background: var(--warm-soft); color: var(--warm); }
.tag.style { background: var(--cool-soft); color: var(--cool); }
.tag svg { width: 12px; height: 12px; }
.tags { display: flex; gap: 6px; flex-wrap: wrap; }

/* Exercise list */
.ex-list { display: flex; flex-direction: column; background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); overflow: hidden; }
.ex-item { display: flex; align-items: center; gap: 14px; padding: 14px 16px; border: 0; background: none; text-align: left; width: 100%; border-top: 1px solid var(--line); }
.ex-item:first-child { border-top: 0; }
.ex-item .num { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: .85rem; flex: none; font-variant-numeric: tabular-nums; }
.warmth .num { background: var(--warm-soft); color: var(--warm); }
.coolth .num { background: var(--cool-soft); color: var(--cool); }
.ex-item .txt { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.ex-item .txt b { font-family: var(--f-display); font-size: 1rem; }
.ex-item .sub { font-size: .85rem; color: var(--muted); display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.ex-item .dur { font-variant-numeric: tabular-nums; font-size: .88rem; color: var(--muted); flex: none; }
.ipa { font-family: ui-monospace, "Cascadia Mono", Menlo, monospace; font-size: .82rem; }
.summary { display: flex; gap: 18px; font-variant-numeric: tabular-nums; }
.summary div { display: flex; flex-direction: column; }
.summary b { font-family: var(--f-display); font-size: 1.6rem; }
.summary span { font-size: .8rem; color: var(--muted); }
.sticky-cta { position: sticky; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 8px; }

/* Filters */
.chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
.chip { border: 1.5px solid var(--line); background: var(--surface); border-radius: 99px; padding: 7px 14px; font-size: .9rem; font-weight: 700; white-space: nowrap; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.group { display: flex; flex-direction: column; gap: 10px; }

/* Exercise detail */
.video { position: relative; aspect-ratio: 16 / 9; max-width: 100%; border-radius: var(--r); overflow: hidden; background: var(--ink); color: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; text-align: center; padding: 16px; }
.video video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.video .bars { display: flex; gap: 4px; align-items: center; height: 46px; opacity: .55; }
.video .bars i { width: 4px; border-radius: 4px; background: currentColor; }
.video small { font-size: .82rem; opacity: .75; max-width: 30ch; }
.facts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.facts div { background: var(--surface); border-radius: 14px; padding: 10px 12px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.facts span { font-size: .72rem; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 700; }
.facts b { font-size: .95rem; overflow-wrap: anywhere; }
.steps { margin: 0; padding: 0; list-style: none; counter-reset: s; display: flex; flex-direction: column; gap: 12px; }
.steps li { counter-increment: s; display: grid; grid-template-columns: 30px 1fr; gap: 12px; align-items: start; }
.steps li::before { content: counter(s); width: 30px; height: 30px; border-radius: 50%; border: 1.5px solid var(--line); display: grid; place-items: center; font-weight: 700; font-size: .85rem; }
.note { border-radius: 14px; padding: 14px 16px; background: var(--surface); display: flex; flex-direction: column; gap: 4px; }
.note.warn { background: var(--warm-soft); }
.pref { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.pref button { border: 1.5px solid var(--line); background: var(--surface); border-radius: 14px; padding: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px; }
.pref button svg { width: 18px; height: 18px; }
.pref button[aria-pressed="true"].like { border-color: var(--warm); color: var(--warm); background: var(--warm-soft); }
.pref button[aria-pressed="true"].nope { border-color: var(--bad); color: var(--bad); }

/* Session player */
.player { display: flex; flex-direction: column; gap: 20px; align-items: stretch; min-height: calc(100dvh - 60px); }
.progress { display: flex; gap: 4px; }
.progress i { height: 5px; flex: 1; border-radius: 9px; background: var(--line); }
.progress i.done { background: var(--accent); }
.progress i.now { background: linear-gradient(90deg, var(--accent) var(--p, 0%), var(--line) var(--p, 0%)); }
.ring-wrap { position: relative; width: min(240px, 70vw); aspect-ratio: 1; max-width: 100%; align-self: center; }
.ring-wrap svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring-wrap .t { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.ring-wrap .t b { font-family: var(--f-display); font-size: 3.2rem; font-weight: 800; font-variant-numeric: tabular-nums; }
.controls { display: flex; justify-content: center; align-items: center; gap: 22px; }
.controls .main { width: 72px; height: 72px; border-radius: 50%; border: 0; background: var(--accent); color: #fff; display: grid; place-items: center; }
.controls .main svg { width: 30px; height: 30px; }
.next-up { font-size: .9rem; color: var(--muted); text-align: center; }

/* Confirm */
.confirm { border: 1.5px solid var(--bad); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.confirm .row { display: flex; gap: 10px; }

/* Bottom nav */
.nav { position: fixed; left: 0; right: 0; bottom: 0; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); z-index: 5; }
.nav .in { max-width: 480px; margin: 0 auto; display: grid; grid-template-columns: repeat(3, 1fr); }
.nav button { border: 0; background: none; padding: 10px 0 12px; display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: .78rem; font-weight: 700; color: var(--muted); }
.nav button svg { width: 22px; height: 22px; }
.nav button[aria-current="page"] { color: var(--ink); }
.toast { position: fixed; left: 50%; bottom: calc(90px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-weight: 700; font-size: .9rem; z-index: 9; max-width: calc(100% - 32px); }
</style>

   Dit is de INGEBOUWDE inhoud: die wordt alleen gebruikt als de app de

  { id:'kaak', titel:'Kaakmassage', soort:['op'], cat:'lichaam', duur:60, stijlen:['alle'], klank:'[ha]',

    stappen:['Leg je vingertoppen op je kaakspier, net voor je oren.','Masseer met kleine cirkels terwijl je mond licht open hangt.','Laat je kaak op het einde zwaar zakken en zucht op [ha].'],

  { id:'staccato', titel:'Staccato op ha', soort:['op'], cat:'adem', duur:60, stijlen:['klassiek','musical','gospel','koor'], klank:'[ha]',

  { id:'rietje', titel:'Zingen door een rietje', soort:['op','af'], cat:'sovt', duur:120, stijlen:['alle'], klank:'[u] door rietje',

async function haalInhoud() {
  const c = window.KURK; if (!c?.url || !c?.key) return;
  const get = pad => fetch(c.url + '/rest/v1/' + pad, { headers: { apikey: c.key } }).then(r => { if (!r.ok) throw new Error(r.status); return r.json(); });
  try {
    const [oefeningen, stijlen, niveaus, inst] = await Promise.all([
      get('oefeningen?select=id,titel,soort,cat,duur,stijlen,niveau,klank,kort,stappen,letop,waarom,video&zichtbaar=is.true&order=positie'),
      get('stijlen?select=id,naam,sub&order=positie'),
      get('niveaus?select=id,naam,sub&order=positie'),
      get('instellingen?select=sleutel,waarde')]);
    const i = { oefeningen, stijlen, niveaus, duren: inst.find(x => x.sleutel === 'duren')?.waarde };
    const tekst = JSON.stringify(i);
    if (tekst === localStorage.getItem(INHOUD_KEY)) return;
    try { localStorage.setItem(INHOUD_KEY, tekst); } catch (e) {}
    nieuweInhoud = i;
    if (kanWisselen()) render();
  } catch (e) { /* offline of Supabase onbereikbaar: verder met wat we hebben */ }
}

/* ---------- Routine samenstellen ---------- */
function hash(s) { let h = 2166136261; for (const c of s) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return (h >>> 0) % 1000 / 1000; }
function score(o, soort) {
  if (data.voorkeur[o.id] === -1) return null;
  if (o.niveau && !o.niveau.includes(data.niveau)) return null;
  let s;
  if (o.stijlen.includes('alle')) s = 1;
  else {
    const overlap = o.stijlen.filter(x => data.stijlen.includes(x)).length;
    if (!overlap && data.voorkeur[o.id] !== 1) return null; // favorieten mogen altijd
    s = 2 + overlap;
  }
  if (data.voorkeur[o.id] === 1) s += 5;
  const mix = data.mix[soort] || 0;
  if (mix) s += hash(o.id + mix) * 2.5;
  return s;
}
function maakRoutine(soort) {
  const doel = (soort === 'op' ? data.duur : Math.max(5, Math.round(data.duur / 2))) * 60;
  const kandidaten = OEFENINGEN.filter(o => o.soort.includes(soort))
    .map(o => ({ o, s: score(o, soort) })).filter(x => x.s !== null)
    .sort((a, b) => b.s - a.s);
  const gekozen = [];
  // 1. de beste oefening per categorie
  for (const cat of VOLGORDE[soort]) { const k = kandidaten.find(x => x.o.cat === cat); if (k) gekozen.push(k); }
  // 2. te lang? laagste score eruit (min. 3 oefeningen)
  const totaal = () => gekozen.reduce((t, x) => t + x.o.duur, 0);
  while (totaal() > doel && gekozen.length > 3) {
    const laagste = gekozen.reduce((m, x) => x.s < m.s ? x : m);
    gekozen.splice(gekozen.indexOf(laagste), 1);
  }
  // 3. te kort? aanvullen met de volgende beste
  for (const k of kandidaten) {
    if (totaal() >= doel - 30) break;
    if (!gekozen.includes(k) && totaal() + k.o.duur <= doel + 30) gekozen.push(k);
  }
  const plek = o => VOLGORDE[soort].indexOf(o.cat);
  return gekozen.sort((a, b) => plek(a.o) - plek(b.o)).map(x => x.o);
}
function reden(o) {
  if (data.voorkeur[o.id] === 1) return '<span class="tag fav">' + I.heart + ' Favoriet</span>';
  if (o.stijlen.includes('alle')) return '';

  return namen.length ? '<span class="tag style">Voor ' + esc(namen.join(', ')) + '</span>' : '';
}

const stijlNamen = ids => ids.map(x => STIJLEN.find(s => s.id === x)?.naam).filter(Boolean);

const min = s => Math.round(s / 60);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));

  let body = '', knop = '', kanVerder = true;
  if (!NIVEAUS.some(n => n.id === concept.niveau)) concept.niveau = NIVEAUS[0].id;
  if (!DUREN.some(d => d.min === concept.duur)) concept.duur = DUREN[Math.floor(DUREN.length / 2)].min;
  if (st === 0) {
    const bars = Array.from({length: 26}, (_, i) => `<i style="height:${20 + Math.round(Math.abs(Math.sin(i * .7)) * 80)}px;animation-delay:${(i * 0.08).toFixed(2)}s"></i>`).join('');
    body = `<div class="hero-wave" aria-hidden="true">${bars}</div>
      <h1>Kurk</h1>
      <p class="muted" style="font-size:1.1rem">Warm je stem op voor je zingt en laat ze rustig afkoelen erna. Met oefeningen die passen bij hoe jij zingt.</p>`;
    knop = 'Aan de slag';
  } else if (st === 1) {
    body = `<p class="eyebrow">Even kennismaken</p><h1>Hoe mogen we je noemen?</h1>
      <input class="field" id="naam" data-a="naam" placeholder="Je voornaam" value="${esc(concept.naam)}" autocomplete="given-name">
      <p class="muted">Mag je ook leeg laten.</p>`;
    knop = 'Volgende';
  } else if (st === 2) {
    body = `<p class="eyebrow">Je stijl</p><h1>Wat voor zang doe je?</h1><p class="muted">Kies er zoveel als je wilt. We stemmen de oefeningen hierop af.</p>
      <div class="choice-grid">${STIJLEN.map(s => `<button class="choice" data-a="stijl" data-v="${s.id}" aria-pressed="${concept.stijlen.includes(s.id)}"><b>${esc(s.naam)}</b><span>${esc(s.sub)}</span></button>`).join('')}</div>`;
    knop = 'Volgende'; kanVerder = concept.stijlen.length > 0;
  } else if (st === 3) {
    body = `<p class="eyebrow">Ervaring</p><h1>Hoeveel zangervaring heb je?</h1>
      <div class="choice-list">${NIVEAUS.map(n => `<button class="choice" data-a="niveau" data-v="${n.id}" aria-pressed="${concept.niveau === n.id}"><b>${esc(n.naam)}</b><span>${esc(n.sub)}</span></button>`).join('')}</div>`;

    body = `<p class="eyebrow">Tijd</p><h1>Hoe lang wil je meestal opwarmen?</h1><p class="muted">Afkoelen duurt ongeveer de helft. Je kunt dit later altijd aanpassen.</p>

}

}

function exItem(o, i, soort) {
  return `<button class="ex-item" data-a="oefening" data-v="${o.id}">
    <span class="num">${i + 1}</span>
    <span class="txt"><b>${esc(o.titel)}</b><span class="sub"><span>${CATEGORIEEN[o.cat]}</span>${o.klank !== '—' ? `<span class="ipa">${esc(o.klank)}</span>` : ''}${reden(o)}</span></span>
    <span class="dur">${fmt(o.duur)}</span></button>`;
}

function routine() {
  const soort = scherm.soort, r = maakRoutine(soort), t = r.reduce((a, o) => a + o.duur, 0);
  const warm = soort === 'op';
  return `<main class="shell no-nav">
    <div class="topbar"><button class="iconbtn" data-a="tab" data-v="home" aria-label="Terug">${I.back}</button>
      <div class="t"><p class="eyebrow">${warm ? 'Voor het zingen' : 'Na het zingen'}</p><h1>${warm ? 'Opwarmen' : 'Afkoelen'}</h1></div>
      <button class="iconbtn" data-a="mix" data-v="${soort}" aria-label="Andere oefeningen kiezen" title="Andere mix">${I.shuffle}</button></div>
    <div class="summary"><div><b>${min(t)}</b><span>minuten</span></div><div><b>${r.length}</b><span>oefeningen</span></div></div>
    <div class="ex-list ${warm ? 'warmth' : 'coolth'}">${r.map((o, i) => exItem(o, i, soort)).join('')}</div>
    <p class="muted" style="font-size:.9rem">Samengesteld op basis van je stijl, je niveau en je favorieten. Tik op een oefening voor uitleg.</p>
    <div class="sticky-cta"><button class="btn ${warm ? 'warm' : 'cool'}" data-a="start" data-v="${soort}">Start ${warm ? 'opwarmen' : 'afkoelen'}</button></div>
  </main>`;
}

function videoBlok(o) {
  if (o.video) return `<div class="video"><video src="${esc(o.video)}" controls playsinline preload="metadata"></video></div>`;
  const bars = Array.from({length: 22}, (_, i) => `<i style="height:${10 + Math.round(Math.abs(Math.sin(i * 1.3 + o.titel.length)) * 36)}px"></i>`).join('');
  return `<div class="video" role="img" aria-label="Plaats voor instructievideo"><div class="bars">${bars}</div><b>Instructievideo volgt</b><small>Hier komt de video van de logopedist voor deze oefening.</small></div>`;
}

function oefening() {
  const o = byId(scherm.id), v = data.voorkeur[o.id] || 0;
  const stijlTekst = o.stijlen.includes('alle') ? 'Alle stijlen' : esc(stijlNamen(o.stijlen).join(', '));
  return `<main class="shell no-nav">
    <div class="topbar"><button class="iconbtn" data-a="terug" aria-label="Terug">${I.back}</button><div class="t"><p class="eyebrow">${CATEGORIEEN[o.cat]} · ${o.soort.map(s => s === 'op' ? 'opwarmen' : 'afkoelen').join(' & ')}</p></div></div>
    <h1>${esc(o.titel)}</h1>
    <p style="font-size:1.08rem">${esc(o.kort)}</p>
    ${videoBlok(o)}
    <div class="facts"><div><span>Duur</span><b>${fmt(o.duur)}</b></div><div><span>Klank</span><b class="ipa">${esc(o.klank)}</b></div><div><span>Stijl</span><b>${stijlTekst}</b></div></div>
    <section class="group"><h2>Zo doe je het</h2><ol class="steps">${o.stappen.map(s => `<li><span>${esc(s)}</span></li>`).join('')}</ol></section>
    <div class="note warn"><p class="eyebrow">Let op</p><p>${esc(o.letop)}</p></div>
    <div class="note"><p class="eyebrow">Waarom</p><p>${esc(o.waarom)}</p></div>
    <section class="group"><h3>Wat vind je van deze oefening?</h3>
      <div class="pref"><button class="like" data-a="pref" data-v="1" aria-pressed="${v === 1}">${I.heart} Favoriet</button>
      <button class="nope" data-a="pref" data-v="-1" aria-pressed="${v === -1}">${I.nope} Liever niet</button></div>
      <p class="muted" style="font-size:.88rem">Favorieten komen vaker terug in je routine. Oefeningen die je liever niet doet, slaan we over.</p></section>
  </main>`;
}

function bibliotheek() {
  const filters = [['alle','Alles'],['op','Opwarmen'],['af','Afkoelen'],['fav','Favorieten']];
  let lijst = OEFENINGEN;
  if (filter === 'op' || filter === 'af') lijst = lijst.filter(o => o.soort.includes(filter));
  if (filter === 'fav') lijst = lijst.filter(o => data.voorkeur[o.id] === 1);
  const groepen = Object.keys(CATEGORIEEN).map(c => [c, lijst.filter(o => o.cat === c)]).filter(g => g[1].length);
  return `<main class="shell">
    <h1>Oefeningen</h1>
    <div class="chips" role="group" aria-label="Filter">${filters.map(([k, n]) => `<button class="chip" data-a="filter" data-v="${k}" aria-pressed="${filter === k}">${n}</button>`).join('')}</div>
    ${groepen.length ? groepen.map(([c, os]) => `<section class="group"><p class="eyebrow">${CATEGORIEEN[c]}</p>
      <div class="ex-list">${os.map(o => `<button class="ex-item" data-a="oefening" data-v="${o.id}"><span class="txt"><b>${esc(o.titel)}</b><span class="sub"><span>${esc(o.kort)}</span></span></span><span class="dur">${fmt(o.duur)}</span></button>`).join('')}</div></section>`).join('')
      : `<div class="soon"><h3>Nog geen favorieten</h3><p class="muted">Open een oefening en tik op Favoriet om ze hier te verzamelen.</p></div>`}
  </main>${nav('bibliotheek')}`;
}

function profiel() {
  const nFav = Object.values(data.voorkeur).filter(x => x === 1).length;
  const nNee = Object.values(data.voorkeur).filter(x => x === -1).length;
  return `<main class="shell">
    <h1>Profiel</h1>
    <section class="group"><h3>Naam</h3><input class="field" id="pnaam" data-a="pnaam" placeholder="Je voornaam" value="${esc(data.naam)}"></section>
    <section class="group"><h3>Mijn stijlen</h3>
      <div class="choice-grid">${STIJLEN.map(s => `<button class="choice" data-a="pstijl" data-v="${s.id}" aria-pressed="${data.stijlen.includes(s.id)}"><b>${esc(s.naam)}</b><span>${esc(s.sub)}</span></button>`).join('')}</div></section>
    <section class="group"><h3>Ervaring</h3>
      <div class="chips">${NIVEAUS.map(n => `<button class="chip" data-a="pniveau" data-v="${n.id}" aria-pressed="${data.niveau === n.id}">${esc(n.naam)}</button>`).join('')}</div></section>
    <section class="group"><h3>Opwarmtijd</h3>
      <div class="chips">${DUREN.map(d => `<button class="chip" data-a="pduur" data-v="${d.min}" aria-pressed="${data.duur === d.min}">${d.min} min</button>`).join('')}</div></section>
    <section class="group"><h3>Voorkeuren</h3><p class="muted">${nFav} favoriet${nFav === 1 ? '' : 'en'} · ${nNee} overgeslagen</p>
      ${nFav + nNee ? '<button class="link" data-a="wisvoorkeur">Voorkeuren wissen</button>' : ''}</section>
    ${bevestig ? `<div class="confirm"><b>Alles wissen en opnieuw beginnen?</b><p class="muted">Je profiel en voorkeuren worden verwijderd.</p>
      <div class="row"><button class="btn ghost" data-a="reset-nee">Annuleren</button><button class="btn" style="background:var(--bad);color:var(--bg)" data-a="reset-ja">Wissen</button></div></div>`
      : '<button class="btn ghost" data-a="reset">Opnieuw beginnen</button>'}
    <p class="muted" style="font-size:.85rem">Je gegevens blijven op dit toestel, in deze browser. Er wordt niets verstuurd.</p>
    <a class="link" href="https://github.com/jannesdc/kurk/issues/new/choose" target="_blank" rel="noopener" style="align-self:flex-start;font-size:.9rem">Probleem of idee? Laat het ons weten</a>
  </main>${nav('profiel')}`;
}

/* ---------- Begeleide sessie ---------- */
let timer = null;
function startSessie(soort) {
  const lijst = maakRoutine(soort).map(o => o.id);
  ga({ naam:'sessie', soort, lijst, i:0, rest:byId(lijst[0]).duur, loopt:false });
  try { navigator.wakeLock?.request('screen').then(l => scherm.lock = l).catch(() => {}); } catch (e) {}
}
function sessie() {
  const s = scherm, o = byId(s.lijst[s.i]), warm = s.soort === 'op';
  const volgende = s.lijst[s.i + 1] ? 'Hierna: ' + esc(byId(s.lijst[s.i + 1]).titel) : 'Laatste oefening';
  return `<main class="shell no-nav" style="--accent:var(${warm ? '--warm' : '--cool'})"><div class="player">
    <div class="topbar"><button class="iconbtn" data-a="stop" aria-label="Sessie stoppen">${I.close}</button>
      <div class="t"><p class="eyebrow">${warm ? 'Opwarmen' : 'Afkoelen'} · ${s.i + 1} van ${s.lijst.length}</p></div></div>
    <div class="progress" aria-hidden="true">${s.lijst.map((_, i) => `<i class="${i < s.i ? 'done' : i === s.i ? 'now' : ''}"></i>`).join('')}</div>
    <div><h1>${esc(o.titel)}</h1><p class="muted" style="margin-top:6px">${esc(o.kort)}</p></div>
    <div class="ring-wrap"><svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="54" fill="none" stroke="var(--line)" stroke-width="8"/>
      <circle id="ring" cx="60" cy="60" r="54" fill="none" stroke="var(--accent)" stroke-width="8" stroke-linecap="round" stroke-dasharray="339.3" stroke-dashoffset="0"/></svg>
      <div class="t"><b id="tijd">${fmt(s.rest)}</b><span class="ipa muted">${o.klank !== '—' ? esc(o.klank) : ''}</span></div></div>
    <div class="controls">
      <button class="iconbtn" data-a="vorige" aria-label="Vorige oefening" ${s.i === 0 ? 'disabled' : ''}>${I.prev}</button>
      <button class="main" data-a="pauze" aria-label="${s.loopt ? 'Pauzeren' : 'Starten'}">${s.loopt ? I.pause : I.play}</button>
      <button class="iconbtn" data-a="volgende" aria-label="Volgende oefening">${I.skip}</button></div>
    <p class="next-up">${volgende}</p>
    <ol class="steps">${o.stappen.map(x => `<li><span>${esc(x)}</span></li>`).join('')}</ol>
    <button class="link" data-a="oefening" data-v="${o.id}" data-from="sessie">Video en uitleg bekijken</button>
  </div></main>`;
}
function tekenTimer() {
  const s = scherm, o = byId(s.lijst[s.i]), p = 1 - s.rest / o.duur;
  const ring = document.getElementById('ring'), tijd = document.getElementById('tijd'), now = document.querySelector('.progress .now');
  if (ring) ring.setAttribute('stroke-dashoffset', (339.3 * p).toFixed(1));
  if (tijd) tijd.textContent = fmt(Math.ceil(s.rest));
  if (now) now.style.setProperty('--p', (p * 100).toFixed(1) + '%');
}
function loopTimer() {
  stopTimer(); let vorig = performance.now();
  timer = setInterval(() => {
    const nu = performance.now(); scherm.rest -= (nu - vorig) / 1000; vorig = nu;
    if (scherm.rest <= 0) { belletje(); volgendeOef(true); return; }
    tekenTimer();
  }, 200);
}
function stopTimer() { clearInterval(timer); timer = null; }
function volgendeOef(auto) {
  const s = scherm;
  if (s.i >= s.lijst.length - 1) { klaarSessie(); return; }
  s.i++; s.rest = byId(s.lijst[s.i]).duur;
  render(); if (s.loopt) loopTimer();
}
function klaarSessie() {
  const s = scherm;
  data.laatste = { soort:s.soort, t:Date.now() }; bewaar();
  try { s.lock?.release(); } catch (e) {}
  ga({ naam:'klaar', soort:s.soort, lijst:s.lijst });
}
let audio;
function belletje() {
  try {
    audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    [660, 880].forEach((f, i) => {
      const o = audio.createOscillator(), g = audio.createGain(), t = audio.currentTime + i * 0.18;
      o.frequency.value = f; o.type = 'sine';
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.25, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.5);
      o.connect(g).connect(audio.destination); o.start(t); o.stop(t + 0.55);
    });
  } catch (e) {}
}
function klaar() {
  const s = scherm, warm = s.soort === 'op';
  return `<main class="shell no-nav">
    <p class="eyebrow">${warm ? 'Opwarmen' : 'Afkoelen'} afgerond</p>
    <h1>${warm ? 'Je stem is klaar. Veel zangplezier!' : 'Goed gedaan. Gun je stem nu wat rust.'}</h1>
    <section class="group"><h3>Hoe vond je de oefeningen?</h3><p class="muted">Je keuze bepaalt welke oefeningen we je de volgende keer geven.</p>
    <div class="ex-list">${s.lijst.map(id => { const o = byId(id), v = data.voorkeur[id] || 0; return `<div class="ex-item"><span class="txt"><b>${esc(o.titel)}</b></span>
      <span style="display:flex;gap:8px"><button class="iconbtn" data-a="rate" data-id="${id}" data-v="1" aria-pressed="${v === 1}" aria-label="Favoriet" style="${v === 1 ? 'color:var(--warm);border-color:var(--warm)' : ''}">${I.heart}</button>
      <button class="iconbtn" data-a="rate" data-id="${id}" data-v="-1" aria-pressed="${v === -1}" aria-label="Liever niet" style="${v === -1 ? 'color:var(--bad);border-color:var(--bad)' : ''}">${I.nope}</button></span></div>`; }).join('')}</div></section>
    <button class="btn" data-a="tab" data-v="home">Terug naar start</button>
  </main>`;
}

/* ---------- Interactie ---------- */
let terugNaar = null;
document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]'); if (!el || el.disabled) return;
  const a = el.dataset.a, v = el.dataset.v;
  switch (a) {
    case 'ob-verder':
      if (scherm.stap < 4) { scherm.stap++; render(); }
      else { Object.assign(data, concept, { onboarded:true }); bewaar(); ga({ naam:'home' }); toast('Je routine staat klaar'); }
      break;
    case 'ob-terug': scherm.stap--; render(); break;
    case 'stijl': concept.stijlen = concept.stijlen.includes(v) ? concept.stijlen.filter(x => x !== v) : [...concept.stijlen, v]; render(); break;
    case 'niveau': concept.niveau = v; render(); break;
    case 'duur': concept.duur = +v; render(); break;
    case 'tab': ga({ naam:v }); break;
    case 'routine': ga({ naam:'routine', soort:v }); break;
    case 'mix': data.mix[v] = (data.mix[v] || 0) + 1; bewaar(); render(); toast('Nieuwe mix samengesteld'); break;
    case 'oefening': {
      if (el.dataset.from === 'sessie') { terugNaar = { ...scherm, loopt:false }; stopTimer(); }
      else terugNaar = scherm.naam === 'oefening' ? terugNaar : scherm;
      ga({ naam:'oefening', id:v }); break;
    }
    case 'terug': { const t = terugNaar || { naam:'home' }; terugNaar = null; scherm = t; render(); window.scrollTo(0, 0); break; }
    case 'pref': { const n = +v, id = scherm.id; data.voorkeur[id] = data.voorkeur[id] === n ? 0 : n; if (!data.voorkeur[id]) delete data.voorkeur[id]; bewaar(); render();
      toast(data.voorkeur[id] === 1 ? 'Toegevoegd aan favorieten' : data.voorkeur[id] === -1 ? 'We slaan deze oefening voortaan over' : 'Voorkeur gewist'); break; }
    case 'rate': { const id = el.dataset.id, n = +v; data.voorkeur[id] = data.voorkeur[id] === n ? 0 : n; if (!data.voorkeur[id]) delete data.voorkeur[id]; bewaar(); render(); break; }
    case 'filter': filter = v; render(); break;
    case 'pstijl': {
      const nieuw = data.stijlen.includes(v) ? data.stijlen.filter(x => x !== v) : [...data.stijlen, v];
      if (!nieuw.length) { toast('Kies minstens één stijl'); break; }
      data.stijlen = nieuw; bewaar(); render(); break;
    }
    case 'pniveau': data.niveau = v; bewaar(); render(); break;
    case 'pduur': data.duur = +v; bewaar(); render(); break;
    case 'wisvoorkeur': data.voorkeur = {}; bewaar(); render(); toast('Voorkeuren gewist'); break;
    case 'reset': bevestig = true; render(); break;
    case 'reset-nee': bevestig = false; render(); break;
    case 'reset-ja': data = structuredClone(LEEG); bewaar(); concept = { naam:'', stijlen:[], niveau:'beginner', duur:10 }; ga({ naam:'onboarding', stap:0 }); break;
    case 'start': startSessie(v); break;
    case 'pauze': scherm.loopt = !scherm.loopt; stopTimer(); render(); if (scherm.loopt) loopTimer(); break;
    case 'volgende': volgendeOef(false); break;
    case 'vorige': scherm.i--; scherm.rest = byId(scherm.lijst[scherm.i]).duur; render(); if (scherm.loopt) loopTimer(); break;
    case 'stop': try { scherm.lock?.release(); } catch (e) {} ga({ naam:'routine', soort:scherm.soort }); break;
  }
});
document.addEventListener('input', e => {
  if (e.target.dataset.a === 'naam') concept.naam = e.target.value.trim();
  if (e.target.dataset.a === 'pnaam') { data.naam = e.target.value.trim(); bewaar(); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.dataset.a === 'naam') document.querySelector('[data-a="ob-verder"]')?.click();
});

render();
haalInhoud();
</script>
